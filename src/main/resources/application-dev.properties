spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:perfume}
spring.datasource.username=${DB_USER:postgres}

spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

server.error.whitelabel.enabled=false

upload.path=/C:/Users/merik/IdeaProjects/OnlineShop/src/main/resources/uploads

spring.mail.host=smtp.gmail.com
spring.mail.username=webstore.perfume@gmail.com
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.debug=true

spring.data.web.pageable.default-page-size=24

recaptcha.url=https://www.google.com/recaptcha/api/siteverify?secret=%s&response=%s

hostname=localhost:8080

# AWS configuration
aws.s3.bucket.name=${S3_BUCKET_NAME}

# Safe logging: prevent SDK from logging secrets
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.com.gmail.merikbest2015.ecommerce.controller=debug
